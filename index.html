<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3aa8ff">
<title>Water Friends ðŸ’§</title>
<style>
  :root{ color-scheme: light; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{ height:100%; margin:0; overflow:hidden; font-family:'Comic Sans MS','Trebuchet MS',sans-serif; touch-action:manipulation; }
  body{
    background:linear-gradient(160deg,#bfe9ff,#eaf8ff 60%);
    display:flex; flex-direction:column; height:100dvh;
  }
  #stage{ flex:1; position:relative; overflow:hidden; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  #title{
    text-align:center; padding:10px 8px 4px; font-size:22px; font-weight:800;
    color:#0b5e8c; text-shadow:0 2px 0 #fff;
  }

  #modes{
    display:flex; justify-content:center; gap:10px; padding:6px 10px 10px;
  }
  .modeBtn{
    flex:1; max-width:120px; border:none; border-radius:18px; padding:10px 4px;
    font-size:28px; background:#fff; box-shadow:0 4px 0 rgba(0,0,0,.15);
    display:flex; flex-direction:column; align-items:center; gap:2px;
    transition:transform .12s;
  }
  .modeBtn span.lbl{ font-size:13px; font-weight:700; color:#0b5e8c; }
  .modeBtn.active{ background:#ffd34d; transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.15); }
  .modeBtn:active{ transform:translateY(3px) scale(.96); }

  #tempWrap{
    display:flex; align-items:center; gap:10px; padding:8px 18px 10px;
  }
  #tempWrap .ic{ font-size:26px; }
  #temp{
    flex:1; -webkit-appearance:none; appearance:none; height:14px; border-radius:10px;
    background:linear-gradient(90deg,#7ecbff,#ffd34d,#ff7b54);
    outline:none;
  }
  #temp::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:34px; height:34px; border-radius:50%;
    background:#fff; border:4px solid #0b5e8c; box-shadow:0 2px 4px rgba(0,0,0,.3); cursor:pointer;
  }
  #temp::-moz-range-thumb{
    width:34px; height:34px; border-radius:50%; background:#fff; border:4px solid #0b5e8c; cursor:pointer;
  }

  #sugarBtn{
    position:absolute; right:14px; bottom:14px; z-index:5;
    width:72px; height:72px; border-radius:50%; border:none;
    background:#fff; box-shadow:0 4px 0 rgba(0,0,0,.2);
    font-size:34px; display:flex; align-items:center; justify-content:center;
  }
  #sugarBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.2); }

  #stateWord{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    font-size:40px; font-weight:900; color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.25), 0 0 12px rgba(255,255,255,.5);
    pointer-events:none; transition:opacity .3s; letter-spacing:1px;
  }

  #burst{
    position:absolute; inset:0; pointer-events:none;
  }

  @media (min-width:700px){
    #title{ font-size:28px; }
    #stateWord{ font-size:54px; }
  }
</style>
</head>
<body>

<div id="title">ðŸ’§ Water Friends ðŸ’§</div>

<div id="modes">
  <button class="modeBtn" data-t="10" id="m-ice"><span>ðŸ§Š</span><span class="lbl">Ice</span></button>
  <button class="modeBtn active" data-t="50" id="m-water"><span>ðŸ’§</span><span class="lbl">Water</span></button>
  <button class="modeBtn" data-t="95" id="m-steam"><span>ðŸ’¨</span><span class="lbl">Steam</span></button>
</div>

<div id="tempWrap">
  <span class="ic">â„ï¸</span>
  <input type="range" id="temp" min="0" max="100" value="50">
  <span class="ic">ðŸ”¥</span>
</div>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="stateWord">Water</div>
  <button id="sugarBtn" title="Drop sugar cube">ðŸ§ŠðŸ¬</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const tempSlider = document.getElementById('temp');
  const stateWord = document.getElementById('stateWord');
  const modeBtns = document.querySelectorAll('.modeBtn');
  const sugarBtn = document.getElementById('sugarBtn');

  let W,H,DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  function rand(a,b){ return a + Math.random()*(b-a); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  // ---------- Puddle shape ----------
  // The puddle is a flat, irregular blob (not a box): a randomized thickness
  // profile across its width that tapers to zero at both ends, so it reads
  // as a natural puddle rather than a glass. Ice freezes into this exact
  // shape (wherever the water happened to be) instead of snapping to a cube.
  const PCOUNT = 48;
  let puddle;
  let profile = [];

  function computeRegions(){
    const pw = W*0.8;
    const ph = H*0.32;
    const px = (W-pw)/2;
    const py = H*0.6;
    puddle = { x:px, y:py, w:pw, h:ph };
  }

  function genProfile(){
    profile = [];
    const f1=rand(1,2), f2=rand(2,4), f3=rand(3,6);
    const p1=rand(0,Math.PI*2), p2=rand(0,Math.PI*2), p3=rand(0,Math.PI*2);
    for(let i=0;i<=PCOUNT;i++){
      const f = i/PCOUNT;
      let v = 0.62;
      v += Math.sin(f*Math.PI*f1+p1)*0.18;
      v += Math.sin(f*Math.PI*f2+p2)*0.10;
      v += Math.sin(f*Math.PI*f3+p3)*0.06;
      const edgeWindow = Math.sin(Math.PI*f);
      v = Math.max(0.08, v) * edgeWindow;
      profile.push(v);
    }
  }

  function profileAt(fracX, waveOffset){
    fracX = clamp(fracX,0,1);
    const idx = fracX*PCOUNT;
    const i0 = Math.floor(idx), i1 = Math.min(PCOUNT, i0+1);
    const tt = idx-i0;
    let v = profile[i0]*(1-tt) + profile[i1]*tt;
    if(waveOffset) v += Math.sin(fracX*13 + waveOffset)*0.02 + Math.sin(fracX*4 + waveOffset*0.6)*0.015;
    return Math.max(0, v);
  }

  function puddleTopY(fracX, animate){
    const thickness = profileAt(fracX, animate ? frame*0.045 : 0);
    const groundY = puddle.y + puddle.h;
    return groundY - thickness*puddle.h;
  }

  function fracXOf(p){ return clamp((p.x-puddle.x)/puddle.w, 0, 1); }

  // ---------- Particles ----------
  const N = 220;
  let particles = [];
  let sugarParticles = [];
  let wisps = [];

  function initParticles(){
    computeRegions();
    genProfile();
    particles = [];
    for(let i=0;i<N;i++){
      const fx = rand(0.06,0.94);
      const topY = puddleTopY(fx, false);
      const groundY = puddle.y+puddle.h;
      const x = puddle.x + fx*puddle.w;
      const y = rand(topY+1, groundY-2);
      particles.push({
        x, y,
        vx: rand(-0.3,0.3), vy: rand(-0.3,0.3),
        phase: 'liquid',
        evapOrder: undefined
      });
    }
  }

  function computeEvapOrder(p){
    const fx = fracXOf(p);
    const topY = puddleTopY(fx,false);
    const groundY = puddle.y+puddle.h;
    const depthFrac = groundY>topY ? clamp((p.y-topY)/(groundY-topY),0,1) : 0.5;
    return clamp(depthFrac*0.7 + Math.random()*0.3, 0, 1);
  }

  function spawnSugar(){
    sugarParticles = [];
    const cx = puddle.x + puddle.w*0.5, cy = puddle.y + puddle.h*0.4;
    const size = Math.min(puddle.w,puddle.h)*0.16;
    for(let i=0;i<26;i++){
      sugarParticles.push({
        x: cx + rand(-size,size)*0.5,
        y: cy + rand(-size,size)*0.5,
        vx:0, vy:0,
        dissolved:0,
      });
    }
  }

  function hexToRgb(hex){
    const n = parseInt(hex.slice(1),16);
    return [(n>>16)&255,(n>>8)&255,n&255];
  }
  function lerpColor(hexA,hexB,t){
    const a=hexToRgb(hexA), b=hexToRgb(hexB);
    const r=Math.round(a[0]+(b[0]-a[0])*t);
    const g=Math.round(a[1]+(b[1]-a[1])*t);
    const bl=Math.round(a[2]+(b[2]-a[2])*t);
    return `rgb(${r},${g},${bl})`;
  }
  const ICE_COLOR='#3aa8ff', WATER_COLOR='#1f8fe0', STEAM_COLOR='#ff9a62';

  function temp(){ return parseInt(tempSlider.value,10); }

  function stateName(t){
    if(t < 30) return 'ice';
    if(t > 70) return 'steam';
    return 'water';
  }

  const stateMeta = {
    ice:   {label:'Ice ðŸ§Š',    word:'Ice',   bg1:'#cfeeff', bg2:'#eef9ff'},
    water: {label:'Water ðŸ’§',  word:'Water', bg1:'#bfe9ff', bg2:'#eaf8ff'},
    steam: {label:'Steam ðŸ’¨',  word:'Steam', bg1:'#ffe9d6', bg2:'#fff7ee'}
  };

  function syncModeButtons(){
    const s = stateName(temp());
    modeBtns.forEach(b=>{
      const bt = parseInt(b.dataset.t,10);
      b.classList.toggle('active', stateName(bt)===s);
    });
    const meta = stateMeta[s];
    stateWord.textContent = meta.word;
    document.body.style.background = `linear-gradient(160deg, ${meta.bg1}, ${meta.bg2} 60%)`;
  }

  modeBtns.forEach(b=>{
    b.addEventListener('click', ()=>{
      tempSlider.value = b.dataset.t;
      syncModeButtons();
    });
  });
  tempSlider.addEventListener('input', syncModeButtons);

  sugarBtn.addEventListener('click', ()=>{
    spawnSugar();
    sugarBtn.classList.add('used');
  });

  let frame = 0;
  function step(){
    try{
      stepInner();
    }catch(e){
      console.error('Water Friends frame error (skipped):', e);
    }
    requestAnimationFrame(step);
  }
  function stepInner(){
    frame++;
    const t = temp();
    const s = stateName(t);
    const evapProgress = s==='steam' ? clamp((t-70)/30, 0, 1) : 0;
    const puddleThicknessScale = s==='steam' ? (1-evapProgress) : 1;

    ctx.clearRect(0,0,W,H);

    const speed = 0.3 + (t/100)*3.2;
    const jitter = 0.15 + (t/100)*0.9;

    if(puddleThicknessScale > 0.02){
      ctx.save();
      const groundY = puddle.y + puddle.h;
      const animate = (s==='water' || s==='steam');
      ctx.beginPath();
      ctx.moveTo(puddle.x, groundY);
      for(let i=0;i<=40;i++){
        const fx = i/40;
        const baseTop = puddleTopY(fx, animate);
        const top = groundY - (groundY-baseTop)*puddleThicknessScale;
        ctx.lineTo(puddle.x+fx*puddle.w, top);
      }
      ctx.lineTo(puddle.x+puddle.w, groundY);
      ctx.closePath();
      ctx.fillStyle = s==='ice' ? 'rgba(255,255,255,.5)' : 'rgba(255,255,255,.22)';
      ctx.fill();
      if(s==='ice'){
        ctx.strokeStyle = 'rgba(255,255,255,.85)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
      ctx.restore();
    }

    if(puddleThicknessScale > 0.02){
      const chance = t>55 ? Math.min(0.35, (t-55)/45*0.35) : 0;
      if(Math.random() < chance){
        const fx = rand(0.12,0.88);
        const groundY = puddle.y+puddle.h;
        const baseTop = puddleTopY(fx, true);
        const top = groundY - (groundY-baseTop)*puddleThicknessScale;
        wisps.push({ x:puddle.x+fx*puddle.w, y:top, vx:rand(-0.15,0.15), vy:rand(-0.7,-0.35), age:0 });
      }
    }
    wisps.forEach(w=>{ w.age++; w.vy -= 0.004; w.x += w.vx; w.y += w.vy; });
    wisps = wisps.filter(w=>w.age < 70);
    wisps.forEach(w=>{
      const life = 1 - w.age/70;
      ctx.beginPath();
      ctx.arc(w.x, w.y, 3+2*(1-life), 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${0.45*life})`;
      ctx.fill();
    });

    particles.forEach(p=>{
      if(s==='ice'){
        if(p.phase==='gas'){
          const fx = rand(0.06,0.94);
          const topY = puddleTopY(fx,false);
          const groundY = puddle.y+puddle.h;
          p.x = puddle.x + fx*puddle.w;
          p.y = rand(topY+1, groundY-2);
          p.phase = 'liquid';
          p.evapOrder = undefined;
        }
        p.vx = 0; p.vy = 0;

      } else if(s==='water'){
        const groundY = puddle.y+puddle.h;
        if(p.phase==='gas'){
          const fx = fracXOf(p);
          const topY = puddleTopY(fx,true);
          const targetY = (topY+groundY)/2;
          p.vx += (puddle.x+puddle.w*0.5 - p.x)*0.0012 + (Math.random()-0.5)*0.25;
          p.vy += (targetY - p.y)*0.02;
          p.vx *= 0.92; p.vy *= 0.92;
          p.x += p.vx; p.y += p.vy;
          if(p.y >= topY-2 && p.y <= groundY+6 && p.x >= puddle.x-4 && p.x <= puddle.x+puddle.w+4){
            p.phase = 'liquid';
            p.evapOrder = undefined;
          }
        } else {
          p.vx += (Math.random()-0.5)*jitter;
          p.vy += (Math.random()-0.5)*jitter;
          p.vx = clamp(p.vx*0.96, -speed, speed);
          p.vy = clamp(p.vy*0.96, -speed, speed);
          p.x += p.vx; p.y += p.vy;
          const fx = fracXOf(p);
          const topY = puddleTopY(fx, true);
          const left = puddle.x+4, right = puddle.x+puddle.w-4;
          if(p.x < left){ p.x = left; p.vx *= -1; }
          if(p.x > right){ p.x = right; p.vx *= -1; }
          if(p.y < topY){ p.y = topY; p.vy *= -0.6; }
          if(p.y > groundY-3){ p.y = groundY-3; p.vy *= -0.4; }
        }

      } else {
        if(p.phase==='liquid'){
          if(p.evapOrder===undefined) p.evapOrder = computeEvapOrder(p);
          if(evapProgress > p.evapOrder){
            p.phase = 'gas';
            p.vx = (Math.random()-0.5)*1;
            p.vy = -rand(0.5,1.6);
          } else {
            const groundY = puddle.y+puddle.h;
            p.vx += (Math.random()-0.5)*jitter*0.6;
            p.vy += (Math.random()-0.5)*jitter*0.6;
            p.vx = clamp(p.vx*0.9, -speed*0.5, speed*0.5);
            p.vy = clamp(p.vy*0.9, -speed*0.5, speed*0.5);
            p.x += p.vx; p.y += p.vy;
            const fx = fracXOf(p);
            const baseTop = puddleTopY(fx, true);
            const top = groundY - (groundY-baseTop)*puddleThicknessScale;
            const left = puddle.x+4, right = puddle.x+puddle.w-4;
            if(p.x < left){ p.x = left; p.vx *= -1; }
            if(p.x > right){ p.x = right; p.vx *= -1; }
            if(p.y < top){ p.y = top; p.vy *= -0.6; }
            if(p.y > groundY-3){ p.y = groundY-3; p.vy *= -0.4; }
          }
        }
        if(p.phase==='gas'){
          p.vx += (Math.random()-0.5)*jitter*1.4;
          p.vy += (Math.random()-0.5)*jitter*1.4 - 0.02;
          p.vx = clamp(p.vx*0.985, -speed, speed);
          p.vy = clamp(p.vy*0.985, -speed, speed);
          p.x += p.vx; p.y += p.vy;
          if(p.x < -10) p.x = W+10;
          if(p.x > W+10) p.x = -10;
          if(p.y < -10) p.y = H+10;
          if(p.y > H+10) p.y = -10;
        }
      }
    });

    particles.forEach(p=>{
      let r, color, alpha;
      if(s==='ice'){
        r = 3.4; color = ICE_COLOR; alpha = 0.95;
      } else if(s==='water'){
        r = 3.6; color = WATER_COLOR; alpha = 0.92;
      } else {
        if(p.phase==='gas'){
          r = 3; color = STEAM_COLOR; alpha = 0.72;
        } else {
          r = 3.6; color = lerpColor(WATER_COLOR, STEAM_COLOR, evapProgress*0.7); alpha = 0.95;
        }
      }
      ctx.beginPath();
      ctx.arc(p.x,p.y, r, 0, Math.PI*2);
      ctx.fillStyle = color;
      ctx.globalAlpha = alpha;
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    if(sugarParticles.length){
      const groundY = puddle.y+puddle.h;
      sugarParticles.forEach(sp=>{
        if(s==='ice'){
          // frozen solid along with the ice â€” no dissolving, no movement at all
          sp.vx = 0; sp.vy = 0;
        } else if(s==='water'){
          sp.dissolved = Math.min(1, sp.dissolved + 0.004);
          if(sp.dissolved > 0){
            sp.vx += (Math.random()-0.5)*0.5*sp.dissolved;
            sp.vy += (Math.random()-0.5)*0.5*sp.dissolved;
            sp.vx *= 0.95; sp.vy *= 0.95;
            sp.x += sp.vx*sp.dissolved;
            sp.y += sp.vy*sp.dissolved;
          }
          // stay contained inside the actual puddle envelope, not just its bounding box
          const m=8;
          const left=puddle.x+m, right=puddle.x+puddle.w-m;
          const fx = fracXOf(sp);
          const top = puddleTopY(fx, true)+m, bottom = groundY-m;
          if(sp.x<left)sp.x=left; if(sp.x>right)sp.x=right;
          if(sp.y<top)sp.y=top; if(sp.y>bottom)sp.y=bottom;
        } else {
          // steam: sugar doesn't evaporate â€” it settles and stays put at the bottom
          sp.vy += 0.35;
          sp.vx *= 0.9; sp.vy *= 0.9;
          sp.x += sp.vx; sp.y += sp.vy;
          const m=8;
          const left=puddle.x+m, right=puddle.x+puddle.w-m;
          const bottom = groundY-m;
          if(sp.x<left)sp.x=left; if(sp.x>right)sp.x=right;
          if(sp.y>bottom){ sp.y=bottom; sp.vy=0; }
        }
        ctx.save();
        const size = 6*(1-sp.dissolved*0.4);
        ctx.translate(sp.x, sp.y);
        ctx.fillStyle = `rgba(255,255,255,${1-sp.dissolved*0.55})`;
        ctx.strokeStyle = 'rgba(180,180,180,.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.rect(-size/2,-size/2,size,size);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });
    }
  }

  function setup(){
    resize();
    initParticles();
    syncModeButtons();
  }
  window.addEventListener('orientationchange', ()=>setTimeout(setup,200));
  setup();
  requestAnimationFrame(step);

  try{
    const manifest = {
      name: "Water Friends",
      short_name: "Water",
      start_url: ".",
      display: "standalone",
      background_color: "#bfe9ff",
      theme_color: "#3aa8ff",
      icons: []
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = url;
    document.head.appendChild(link);
  }catch(e){}
})();
</script>
</body>
</html>
