<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3aa8ff">
<title>Water Friends 💧</title>
<style>
  :root{ color-scheme: light; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{ height:100%; margin:0; overflow:hidden; font-family:'Comic Sans MS','Trebuchet MS',sans-serif; touch-action:manipulation; }
  body{
    background:linear-gradient(160deg,#bfe9ff,#eaf8ff 60%);
    display:flex; flex-direction:column; height:100dvh;
  }
  #stage{ flex:1; position:relative; overflow:hidden; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  #title{
    text-align:center; padding:10px 8px 4px; font-size:22px; font-weight:800;
    color:#0b5e8c; text-shadow:0 2px 0 #fff;
  }

  /* Big mode buttons */
  #modes{
    display:flex; justify-content:center; gap:10px; padding:6px 10px 10px;
  }
  .modeBtn{
    flex:1; max-width:120px; border:none; border-radius:18px; padding:10px 4px;
    font-size:28px; background:#fff; box-shadow:0 4px 0 rgba(0,0,0,.15);
    display:flex; flex-direction:column; align-items:center; gap:2px;
    transition:transform .12s;
  }
  .modeBtn span.lbl{ font-size:13px; font-weight:700; color:#0b5e8c; }
  .modeBtn.active{ background:#ffd34d; transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.15); }
  .modeBtn:active{ transform:translateY(3px) scale(.96); }

  /* Temperature slider */
  #tempWrap{
    display:flex; align-items:center; gap:10px; padding:8px 18px 10px;
  }
  #tempWrap .ic{ font-size:26px; }
  #temp{
    flex:1; -webkit-appearance:none; appearance:none; height:14px; border-radius:10px;
    background:linear-gradient(90deg,#7ecbff,#ffd34d,#ff7b54);
    outline:none;
  }
  #temp::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:34px; height:34px; border-radius:50%;
    background:#fff; border:4px solid #0b5e8c; box-shadow:0 2px 4px rgba(0,0,0,.3); cursor:pointer;
  }
  #temp::-moz-range-thumb{
    width:34px; height:34px; border-radius:50%; background:#fff; border:4px solid #0b5e8c; cursor:pointer;
  }

  /* Sugar button */
  #sugarBtn{
    position:absolute; right:14px; bottom:14px; z-index:5;
    width:72px; height:72px; border-radius:50%; border:none;
    background:#fff; box-shadow:0 4px 0 rgba(0,0,0,.2);
    font-size:34px; display:flex; align-items:center; justify-content:center;
  }
  #sugarBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.2); }

  #stateWord{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    font-size:40px; font-weight:900; color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.25), 0 0 12px rgba(255,255,255,.5);
    pointer-events:none; transition:opacity .3s; letter-spacing:1px;
  }

  #burst{
    position:absolute; inset:0; pointer-events:none;
  }

  @media (min-width:700px){
    #title{ font-size:28px; }
    #stateWord{ font-size:54px; }
  }
</style>
</head>
<body>

<div id="title">💧 Water Friends 💧</div>

<div id="modes">
  <button class="modeBtn" data-t="10" id="m-ice"><span>🧊</span><span class="lbl">Ice</span></button>
  <button class="modeBtn active" data-t="50" id="m-water"><span>💧</span><span class="lbl">Water</span></button>
  <button class="modeBtn" data-t="95" id="m-steam"><span>💨</span><span class="lbl">Steam</span></button>
</div>

<div id="tempWrap">
  <span class="ic">❄️</span>
  <input type="range" id="temp" min="0" max="100" value="50">
  <span class="ic">🔥</span>
</div>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="stateWord">Water</div>
  <button id="sugarBtn" title="Drop sugar cube">🧊🍬</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const tempSlider = document.getElementById('temp');
  const stateWord = document.getElementById('stateWord');
  const modeBtns = document.querySelectorAll('.modeBtn');
  const sugarBtn = document.getElementById('sugarBtn');

  let W,H,DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  // ---------- Particles ----------
  const N = 220; // water molecules — lots of small dots so shapes read clearly
  let particles = [];
  let sugarParticles = []; // sugar bits that dissolve & wander

  // Shape regions (computed on resize): where each state "lives"
  let iceBox, waterBox; // {x,y,w,h}

  function rand(a,b){ return a + Math.random()*(b-a); }

  function computeRegions(){
    // Ice: a chunky centered block, not the whole screen
    const iw = Math.min(W*0.5, H*0.4);
    const ih = iw * 0.8;
    iceBox = { x:(W-iw)/2, y:(H-ih)/2, w:iw, h:ih };

    // Water: a puddle / glass sitting in the lower 2/3, with wavy top
    const ww = W*0.74;
    const wh = H*0.5;
    waterBox = { x:(W-ww)/2, y:H-wh-H*0.06, w:ww, h:wh };
  }

  function initParticles(){
    particles = [];
    computeRegions();
    const cols = Math.ceil(Math.sqrt(N * iceBox.w/iceBox.h));
    const rows = Math.ceil(N/cols);
    const padX = iceBox.w/(cols+1), padY = iceBox.h/(rows+1);
    let i=0;
    for(let r=0;r<rows;r++){
      for(let cc=0;cc<cols;cc++){
        if(i>=N) break;
        const hx = iceBox.x + padX*(cc+1) + rand(-2,2);
        const hy = iceBox.y + padY*(r+1) + rand(-2,2);
        particles.push({
          x: hx, y: hy,
          vx: rand(-0.4,0.4), vy: rand(-0.4,0.4),
          hx, hy
        });
        i++;
      }
    }
  }

  function spawnSugar(){
    sugarParticles = [];
    const cx = waterBox.x + waterBox.w*0.5, cy = waterBox.y + waterBox.h*0.3;
    const size = Math.min(waterBox.w,waterBox.h)*0.16;
    for(let i=0;i<26;i++){
      sugarParticles.push({
        x: cx + rand(-size,size)*0.5,
        y: cy + rand(-size,size)*0.5,
        vx:0, vy:0,
        dissolved:0, // 0=solid cube bit -> 1=fully dissolved/floating
      });
    }
  }

  // ---------- State logic ----------
  function temp(){ return parseInt(tempSlider.value,10); } // 0..100

  function stateName(t){
    if(t < 30) return 'ice';
    if(t > 70) return 'steam';
    return 'water';
  }

  const stateMeta = {
    ice:   {label:'Ice 🧊',    word:'Ice',   bg1:'#cfeeff', bg2:'#eef9ff', dot:'#3aa8ff'},
    water: {label:'Water 💧',  word:'Water', bg1:'#bfe9ff', bg2:'#eaf8ff', dot:'#1f8fe0'},
    steam: {label:'Steam 💨',  word:'Steam', bg1:'#ffe9d6', bg2:'#fff7ee', dot:'#ff9a62'}
  };

  function syncModeButtons(){
    const s = stateName(temp());
    modeBtns.forEach(b=>{
      const bt = parseInt(b.dataset.t,10);
      b.classList.toggle('active', stateName(bt)===s);
    });
    const meta = stateMeta[s];
    stateWord.textContent = meta.word;
    document.body.style.background = `linear-gradient(160deg, ${meta.bg1}, ${meta.bg2} 60%)`;
  }

  modeBtns.forEach(b=>{
    b.addEventListener('click', ()=>{
      tempSlider.value = b.dataset.t;
      syncModeButtons();
    });
  });
  tempSlider.addEventListener('input', syncModeButtons);

  sugarBtn.addEventListener('click', ()=>{
    spawnSugar();
    sugarBtn.classList.add('used');
  });

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // ---------- Animation ----------
  let frame = 0;
  function step(){
    frame++;
    const t = temp();
    const s = stateName(t);
    const meta = stateMeta[s];

    ctx.clearRect(0,0,W,H);

    // speed & spread scale with temperature
    const speed = 0.3 + (t/100)*3.2;
    const jitter = 0.15 + (t/100)*0.9;

    // --- draw container / shape guides first (behind particles) ---
    if(s==='ice'){
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.lineWidth = 3;
      roundRect(ctx, iceBox.x-6, iceBox.y-6, iceBox.w+12, iceBox.h+12, 14);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    } else if(s==='water'){
      ctx.save();
      const waveTop = waterBox.y;
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      ctx.beginPath();
      ctx.moveTo(waterBox.x, waveTop);
      for(let x=0;x<=waterBox.w;x+=10){
        const yy = waveTop + Math.sin((x*0.05)+frame*0.05)*4;
        ctx.lineTo(waterBox.x+x, yy);
      }
      ctx.lineTo(waterBox.x+waterBox.w, waterBox.y+waterBox.h);
      ctx.lineTo(waterBox.x, waterBox.y+waterBox.h);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    particles.forEach(p=>{
      if(s==='ice'){
        // vibrate near lattice home, tightly bound -> reads as a solid block
        p.vx += (Math.random()-0.5)*jitter*0.5;
        p.vy += (Math.random()-0.5)*jitter*0.5;
        p.vx *= 0.7; p.vy *= 0.7;
        p.x += p.vx*0.6; p.y += p.vy*0.6;
        p.x += (p.hx - p.x)*0.18;
        p.y += (p.hy - p.y)*0.18;
      } else if(s==='water'){
        p.vx += (Math.random()-0.5)*jitter;
        p.vy += (Math.random()-0.5)*jitter;
        p.vx = Math.max(-speed, Math.min(speed, p.vx*0.96));
        p.vy = Math.max(-speed, Math.min(speed, p.vy*0.96));
        p.x += p.vx; p.y += p.vy;
        // keep inside the puddle/glass region -> reads as a liquid body
        const m = 6;
        const left = waterBox.x+m, right = waterBox.x+waterBox.w-m;
        const top = waterBox.y+m, bottom = waterBox.y+waterBox.h-m;
        if(p.x < left){ p.x = left; p.vx *= -1; }
        if(p.x > right){ p.x = right; p.vx *= -1; }
        if(p.y < top){ p.y = top; p.vy *= -1; }
        if(p.y > bottom){ p.y = bottom; p.vy *= -1; }
      } else { // steam
        p.vx += (Math.random()-0.5)*jitter*1.4;
        p.vy += (Math.random()-0.5)*jitter*1.4 - 0.02; // gentle upward drift
        p.vx = Math.max(-speed, Math.min(speed, p.vx*0.985));
        p.vy = Math.max(-speed, Math.min(speed, p.vy*0.985));
        p.x += p.vx; p.y += p.vy;
        // wrap around screen, free roaming everywhere -> reads as filling the air
        if(p.x < -10) p.x = W+10;
        if(p.x > W+10) p.x = -10;
        if(p.y < -10) p.y = H+10;
        if(p.y > H+10) p.y = -10;
      }
    });

    // draw water molecules — small, plentiful dots
    const dotR = s==='ice' ? 3.4 : (s==='steam' ? 3 : 3.6);
    particles.forEach(p=>{
      ctx.beginPath();
      ctx.arc(p.x,p.y, dotR, 0, Math.PI*2);
      ctx.fillStyle = meta.dot;
      ctx.globalAlpha = s==='steam' ? 0.75 : 0.92;
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    // sugar particles: behave like a cube at first, dissolve into wandering dots only in water/steam
    if(sugarParticles.length){
      const canDissolve = (s!=='ice');
      sugarParticles.forEach(sp=>{
        if(canDissolve){
          sp.dissolved = Math.min(1, sp.dissolved + 0.004 + (t/100)*0.01);
        }
        if(sp.dissolved > 0){
          sp.vx += (Math.random()-0.5)*0.5*sp.dissolved;
          sp.vy += (Math.random()-0.5)*0.5*sp.dissolved;
          sp.vx *= 0.95; sp.vy *= 0.95;
          sp.x += sp.vx*sp.dissolved;
          sp.y += sp.vy*sp.dissolved;
          const m=8;
          const left=waterBox.x+m, right=waterBox.x+waterBox.w-m;
          const top=waterBox.y+m, bottom=waterBox.y+waterBox.h-m;
          if(sp.x<left)sp.x=left; if(sp.x>right)sp.x=right;
          if(sp.y<top)sp.y=top; if(sp.y>bottom)sp.y=bottom;
        }
        ctx.save();
        const size = 6*(1-sp.dissolved*0.4);
        ctx.translate(sp.x, sp.y);
        ctx.fillStyle = `rgba(255,255,255,${1-sp.dissolved*0.55})`;
        ctx.strokeStyle = 'rgba(180,180,180,.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.rect(-size/2,-size/2,size,size);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });
    }

    requestAnimationFrame(step);
  }

  // ---------- Init ----------
  function setup(){
    resize();
    initParticles();
    syncModeButtons();
  }
  window.addEventListener('orientationchange', ()=>setTimeout(setup,200));
  setup();
  requestAnimationFrame(step);

  // ---------- Tiny PWA install bits (manifest via Blob, no service worker needed for demo) ----------
  try{
    const manifest = {
      name: "Water Friends",
      short_name: "Water",
      start_url: ".",
      display: "standalone",
      background_color: "#bfe9ff",
      theme_color: "#3aa8ff",
      icons: []
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = url;
    document.head.appendChild(link);
  }catch(e){}
})();
</script>
</body>
</html>
